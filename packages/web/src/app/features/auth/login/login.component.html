<section class="auth-shell">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <p class="brand-mark mb-2">Appiary</p>
      <h1 class="h3 mb-3">Welcome back</h1>
      <p class="text-secondary mb-4">Sign in to access your account.</p>

      @if (authStore.error()) {
        <div class="alert alert-danger" role="alert">{{ authStore.error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" class="form-control" type="email" formControlName="email">
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input id="password" class="form-control" type="password" formControlName="password">
        </div>

        <button class="btn btn-dark w-100" type="submit" [disabled]="authStore.isLoading()">
          {{ authStore.isLoading() ? "Signing in..." : "Sign in" }}
        </button>
      </form>

      <p class="mb-0 mt-4 text-center">
        Need an account?
        <a routerLink="/register">Register</a>
      </p>
    </div>
  </div>
</section>
