<article
  class="card hive-card h-100 border-0 shadow-sm position-relative"
  [attr.data-testid]="'hive-card-' + hive.hiveId"
>
  <div class="position-absolute top-0 end-0 m-2 d-flex gap-2">
    <button class="btn btn-primary btn-sm" type="button" aria-label="Add Inspection" title="Add Inspection" (click)="inspectHive()">
      <span aria-hidden="true">+</span>
    </button>
    <button class="btn btn-light btn-sm edit-hive-button" type="button" aria-label="Edit Hive" title="Edit Hive" (click)="editHive()">
      <span aria-hidden="true">&#9998;</span>
    </button>
  </div>

  <div class="card-body d-flex flex-column gap-3 pe-5">
    <div>
      <p class="brand-mark mb-2">Hive</p>
      <h2 class="h5 mb-0 text-break">{{ hive.name }}</h2>
    </div>

    <span class="badge align-self-start" [class.text-bg-success]="hive.status" [class.text-bg-secondary]="!hive.status">
      {{ statusLabel }}
    </span>

    @if (inspections.length > 0) {
      <table class="table table-sm mb-0">
        <caption class="visually-hidden">Latest inspections for {{ hive.name }}</caption>
        <thead><tr><th scope="col">Inspection Date</th></tr></thead>
        <tbody>
          @for (inspection of inspections; track inspection.inspectionId) {
            <tr><td><button class="btn btn-link p-0" type="button" (click)="openInspection(inspection)">{{ inspection.inspectionDate }}</button></td></tr>
          }
        </tbody>
      </table>
    }
  </div>
</article>
