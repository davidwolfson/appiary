<article class="card hive-card h-100 border-0 shadow-sm position-relative">
  <button
    class="btn btn-light btn-sm edit-hive-button position-absolute top-0 end-0 m-2"
    type="button"
    aria-label="Edit Hive"
    title="Edit Hive"
    (click)="editHive()"
  >
    <span aria-hidden="true">&#9998;</span>
  </button>

  <div class="card-body d-flex flex-column gap-3 pe-5">
    <div>
      <p class="brand-mark mb-2">Hive</p>
      <h2 class="h5 mb-0 text-break">{{ hive.name }}</h2>
    </div>

    <span class="badge align-self-start" [class.text-bg-success]="hive.status" [class.text-bg-secondary]="!hive.status">
      {{ statusLabel }}
    </span>
  </div>
</article>
