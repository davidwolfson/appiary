<div class="modal-backdrop fade show"></div>
<section
  #dialog
  class="modal fade show d-block"
  role="dialog"
  aria-modal="true"
  aria-labelledby="edit-hive-title"
  tabindex="-1"
  (keydown)="handleKeydown($event)"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h2 id="edit-hive-title" class="modal-title h5">{{ title }}</h2>
        <button class="btn-close" type="button" aria-label="Close" (click)="close()" [disabled]="isSaving"></button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="modal-body">
          @if (error) {
            <div class="alert alert-danger" role="alert">{{ error }}</div>
          }

          <div class="mb-3">
            <label class="form-label" for="hive-name">Hive Name</label>
            <input #nameInput id="hive-name" class="form-control" type="text" formControlName="name" maxlength="100">
            @if (form.controls.name.touched && form.controls.name.value.trim().length === 0) {
              <div class="invalid-feedback d-block">Hive name is required.</div>
            } @else if (form.controls.name.touched && form.controls.name.hasError("maxlength")) {
              <div class="invalid-feedback d-block">Hive name must be 100 characters or fewer.</div>
            }
          </div>

          <div class="mb-0">
            <label class="form-label" for="hive-status">Status</label>
            <select id="hive-status" class="form-select" formControlName="status">
              <option [ngValue]="true">Active</option>
              <option [ngValue]="false">Inactive</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-outline-secondary" type="button" (click)="close()" [disabled]="isSaving">Cancel</button>
          <button class="btn btn-dark" type="submit" [disabled]="isSaving">
            {{ isSaving ? "Saving..." : "Save Hive" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
