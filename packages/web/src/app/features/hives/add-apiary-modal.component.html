<div class="modal-backdrop fade show"></div>
<section
  #dialog
  class="modal fade show d-block"
  role="dialog"
  aria-modal="true"
  aria-labelledby="add-apiary-title"
  tabindex="-1"
  (keydown)="handleKeydown($event)"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h2 id="add-apiary-title" class="modal-title h5">Add Apiary</h2>
        <button class="btn-close" type="button" aria-label="Close Add Apiary" (click)="close()" [disabled]="isSaving"></button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="modal-body">
          @if (error) {
            <div class="alert alert-danger" role="alert">{{ error }}</div>
          }

          <div class="mb-0">
            <label class="form-label" for="apiary-name">Apiary Name</label>
            <input
              #nameInput
              id="apiary-name"
              class="form-control"
              type="text"
              formControlName="name"
              maxlength="100"
              [attr.aria-describedby]="form.controls.name.touched && form.controls.name.invalid ? 'apiary-name-error' : null"
              [attr.aria-invalid]="form.controls.name.touched && form.controls.name.invalid"
            >
            @if (form.controls.name.touched && form.controls.name.value.trim().length === 0) {
              <div id="apiary-name-error" class="invalid-feedback d-block">Apiary name is required.</div>
            } @else if (form.controls.name.touched && form.controls.name.hasError("maxlength")) {
              <div id="apiary-name-error" class="invalid-feedback d-block">Apiary name must be 100 characters or fewer.</div>
            }
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-outline-secondary" type="button" aria-label="Cancel Add Apiary" (click)="close()" [disabled]="isSaving">Cancel</button>
          <button class="btn btn-primary" type="submit" [attr.aria-label]="isSaving ? 'Saving Apiary...' : 'Save Apiary'" [disabled]="isSaving">
            {{ isSaving ? "Saving Apiary..." : "Save Apiary" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
